name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install libdbus-1-dev and pkg-config
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify tag matches crate version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not of the form vX.Y.Z" >&2
            exit 1
          fi
          grep -qxm1 "version = \"${version}\"" Cargo.toml || {
            echo "Cargo.toml version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          grep -q "\"version\": \"${version}\"" packaging/mcpb/manifest.json || {
            echo "MCPB manifest version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          test "$(grep -c "\"version\": \"${version}\"" packaging/mcpb/server.json.template)" -eq 2 || {
            echo "Registry template versions do not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          grep -q "\"version\": \"${version}\"" server.json || {
            echo "server.json version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }
          grep -qxm1 "pkgver=${version}" packaging/aur/PKGBUILD || {
            echo "AUR PKGBUILD version does not match tag ${GITHUB_REF_NAME}" >&2
            exit 1
          }

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke-test packaged binary
        run: ./target/release/mc3000-mcp --version

      - name: Verify crate packaging
        run: |
          cargo package --locked
          # Dry-run only; production crates.io publishing uses trusted publishing
          # after manual verification of the packaged crate.
          cargo publish --locked --dry-run

      - name: Assemble release artifacts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="mc3000-mcp-${version}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/${name}"
          cp target/release/mc3000-mcp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          ( cd dist && b2sum "${name}.tar.gz" > "${name}.tar.gz.b2" )
          rm -rf "dist/${name}"
          source_name="mc3000-mcp-${version}-source.tar.gz"
          git archive --format=tar.gz --prefix="mc3000-mcp-${version}/" -o "dist/${source_name}" HEAD
          ( cd dist && b2sum "${source_name}" > "${source_name}.b2" )

      - name: Pack MCPB bundle and render server.json
        run: |
          set -euo pipefail
          pack_log=$(bash packaging/mcpb/pack.sh target/release/mc3000-mcp dist)
          echo "$pack_log"
          mcpb_sha256=$(printf '%s\n' "$pack_log" | awk 'NR==1 {print $1}')
          mcpb_path=$(printf '%s\n' "$pack_log" | awk 'NR==1 {print $2}')
          mcpb_name=$(basename "$mcpb_path")
          ( cd dist && b2sum "$mcpb_name" > "${mcpb_name}.b2" )
          mcpb_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${mcpb_name}"
          bash packaging/mcpb/render-server-json.sh packaging/mcpb/server.json.template "$mcpb_url" "$mcpb_sha256" dist/server.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Attest and publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd dist
          b2sum -c --strict ./*.b2

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.b2
            dist/*.mcpb
            dist/server.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "mc3000-mcp ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag

  aur-metadata:
    name: AUR metadata check
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git for checkout
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify .SRCINFO is synchronized
        run: |
          set -euo pipefail
          useradd -m pkgbuild
          chown -R pkgbuild:pkgbuild .
          cd packaging/aur
          sudo -u pkgbuild makepkg --printsrcinfo > /tmp/.SRCINFO.expected
          diff -u .SRCINFO /tmp/.SRCINFO.expected
